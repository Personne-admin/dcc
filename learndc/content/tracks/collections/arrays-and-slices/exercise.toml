schema = 1
id = "collections/arrays-and-slices"
revision = 1
title = "Fixed arrays and slices"
summary = "Pass a fixed array or a window of it to functions that take a slice."
kind = "implement-function"
difficulty = "beginner"
estimated_minutes = 10
concepts = ["fixed array", "slice", "len", "slicing", "bounds checking"]
tags = ["arrays", "slices", "loops"]
objectives = [
    "Tell a fixed array (i32[5]) from a borrowed slice ([]const i32)",
    "Create a slice with a[start..end] and pass it to a function",
    "Walk a slice with for-in and guard indexing of an empty slice",
]
entry_file = "src/main.dc"
product = "scoreboard"
prerequisites = ["loops/ranges"]
requires = ["dcc", "dpm"]
min_dcc = "0.6.0"
platforms = ["linux", "windows"]
backends = ["llvm", "custom"]
starter_state = "fails-checks"

[[checks]]
kind = "build"
name = "Compiles"

[[checks]]
kind = "run"
name = "Prints the two summaries"
expect_stdout = """
all: total 73, highest 31
last two: total 23, highest 19
"""
expect_exit = 0
max_seconds = 10
hint = "total adds every element; highest returns the largest one."

[[checks]]
kind = "harness"
name = "total and highest handle empty, partial and negative slices"
harness = "checks/scores_check.dc"
expect_exit = 0
max_seconds = 10
hint = "An empty slice must give 0, and highest must work when every value is negative."
