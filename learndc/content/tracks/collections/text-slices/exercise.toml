schema = 1
id = "collections/text-slices"
revision = 2
title = "Search and slice text"
summary = "Walk text with an index loop to count characters, look for one and cut out the first word."
kind = "implement-function"
difficulty = "beginner"
estimated_minutes = 15
concepts = ["[]const char", "slices", "for loop", "index", "early return", "sub-range"]
tags = ["text", "slices"]
objectives = [
    "Walk a []const char with a C-style for loop and compare its characters",
    "Return early from inside a loop when the answer is known",
    "Return a sub-slice such as text[0..i] without copying",
]
entry_file = "src/main.dc"
product = "words"
prerequisites = ["collections/arrays-and-slices"]
requires = ["dcc", "dpm"]
min_dcc = "0.6.0"
platforms = ["linux", "windows"]
backends = ["llvm", "custom"]
starter_state = "fails-checks"

[[checks]]
kind = "build"
name = "Compiles"

[[checks]]
kind = "run"
name = "Demo program output"
expect_stdout = """
text: the quick brown fox
spaces: 3
has q: true
has z: false
first word: the
"""
expect_exit = 0
max_seconds = 10
hint = "main.dc is finished; the output depends on the three functions in src/words.dc."

[[checks]]
kind = "harness"
name = "count_char counts every match"
harness = "checks/count_char_check.dc"
expect_exit = 0
max_seconds = 10
hint = "Count each position where the character equals target; an empty text has zero."

[[checks]]
kind = "harness"
name = "has_char says whether a character occurs"
harness = "checks/has_char_check.dc"
expect_exit = 0
max_seconds = 10
hint = "Return true from inside the loop at the first match and false only after the loop."

[[checks]]
kind = "harness"
name = "first_word stops before the first space"
harness = "checks/first_word_check.dc"
expect_exit = 0
max_seconds = 10
hint = "text[0..i] excludes position i, so it ends just before the space."
