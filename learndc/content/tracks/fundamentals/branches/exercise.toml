schema = 1
id = "fundamentals/branches"
revision = 1
title = "Branching with if and else"
summary = "Classify numbers and clamp a value with if, else if and else."
kind = "implement-function"
chapter = "control-flow"
difficulty = "beginner"
estimated_minutes = 10
concepts = ["if", "else if", "else", "comparison operators", "early return"]
tags = ["control-flow", "conditions"]
objectives = [
    "Choose between alternatives with if, else if and else",
    "Return borrowed text from different branches",
    "Use comparison operators and handle the boundary values",
]
entry_file = "src/main.dc"
product = "branches"
prerequisites = ["fundamentals/functions"]
requires = ["dcc", "dpm"]
min_dcc = "0.6.0"
platforms = ["linux", "windows"]
backends = ["llvm", "custom"]
starter_state = "fails-checks"

[[checks]]
kind = "build"
name = "Compiles"

[[checks]]
kind = "run"
name = "Program prints classifications"
expect_stdout = """
-5 is negative
0 is zero
8 is positive
score 95 earns A
score 83 earns B
score 71 earns C
score 40 earns F
clamp(15, 0, 10) = 10
clamp(-4, 0, 10) = 0
clamp(6, 0, 10) = 6
"""
expect_exit = 0
max_seconds = 10
hint = "The three functions in src/classify.dc still return placeholders."

[[checks]]
kind = "harness"
name = "describe and grade"
harness = "checks/text_checks.dc"
expect_exit = 0
max_seconds = 10
hint = "A score of exactly 90 is an A, 80 a B and 70 a C. Use >= for the boundaries."

[[checks]]
kind = "harness"
name = "clamp"
harness = "checks/clamp_checks.dc"
expect_exit = 0
max_seconds = 10
hint = "A value below low returns low, above high returns high, otherwise the value itself."
