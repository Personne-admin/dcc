schema = 1
id = "fundamentals/diagnostics"
revision = 1
title = "Reading compiler errors"
summary = "Read a real dcc error, find the line it points to and repair the call."
kind = "understand-diagnostics"
chapter = "diagnostics"
difficulty = "beginner"
estimated_minutes = 8
concepts = ["diagnostics", "error messages", "source locations", "function calls"]
tags = ["diagnostics", "debugging", "functions"]
objectives = [
    "Identify the message, the location and the code frame in a dcc error",
    "Use the candidate note to compare a call with a function signature",
    "Repair a call with the wrong number of arguments",
]
entry_file = "src/main.dc"
product = "receipt"
prerequisites = ["fundamentals/match"]
requires = ["dcc", "dpm"]
min_dcc = "0.6.0"
platforms = ["linux", "windows"]
backends = ["llvm", "custom"]
starter_state = "fails-build"

[[checks]]
kind = "build"
name = "Compiles"

[[checks]]
kind = "run"
name = "Receipt for three notebooks"
expect_stdout = """
Item: notebook
Total: 750 cents
"""
expect_exit = 0
max_seconds = 10
hint = "One notebook costs 250 cents and the customer buys 3."
