schema = 1
id = "fundamentals/variables"
revision = 1
title = "Variables and types"
summary = "Fix a type mismatch and swapped values in a small rectangle report."
kind = "repair-compilation"
chapter = "basics"
difficulty = "beginner"
estimated_minutes = 8
concepts = ["variables", "types", "i32", "assignment"]
tags = ["variables", "types"]
objectives = [
    "Declare variables with the type first and an initial value",
    "Read a type mismatch diagnostic and match a value to its declared type",
    "Assign a computed value to an existing variable",
]
entry_file = "src/main.dc"
product = "variables"
prerequisites = ["fundamentals/hello-world"]
requires = ["dcc", "dpm"]
min_dcc = "0.6.0"
platforms = ["linux", "windows"]
backends = ["llvm", "custom"]
starter_state = "fails-build"

[[checks]]
kind = "build"
name = "Compiles"

[[checks]]
kind = "run"
name = "Reports a 12 x 5 rectangle with area 60"
expect_stdout = """
Rectangle: 12 x 5
Area: 60
"""
expect_exit = 0
max_seconds = 10
hint = "Width must be 12 and height must be 5, and every value must have the type of its variable."
