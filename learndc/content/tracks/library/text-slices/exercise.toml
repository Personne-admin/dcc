schema = 1
id = "library/text-slices"
revision = 1
title = "Search and slice text"
summary = "Implement counting, searching and sub-slicing over []const char."
kind = "implement-function"
chapter = "text"
difficulty = "beginner"
estimated_minutes = 15
concepts = ["[]const char", "slices", "Optional", "loops", "sub-range"]
tags = ["text", "slices"]
objectives = [
    "Walk a []const char with an index loop and compare its characters",
    "Return Optional(usize) for a search that may find nothing",
    "Return a sub-slice such as text[0..i] without copying",
]
entry_file = "src/main.dc"
product = "words"
prerequisites = ["library/formatting"]
requires = ["dcc", "dpm"]
min_dcc = "0.6.0"
platforms = ["linux", "windows"]
backends = ["llvm", "custom"]
starter_state = "fails-checks"

[[checks]]
kind = "build"
name = "Compiles"

[[checks]]
kind = "run"
name = "Demo program output"
expect_stdout = """
text: the quick brown fox
spaces: 3
first q at: 4
first word: the
"""
expect_exit = 0
max_seconds = 10
hint = "main.dc is finished; the output depends on the three functions in src/words.dc."

[[checks]]
kind = "harness"
name = "count_char counts every match"
harness = "checks/count_char_check.dc"
expect_exit = 0
max_seconds = 10
hint = "Count each position where the character equals target; an empty text has zero."

[[checks]]
kind = "harness"
name = "find_char returns the first position or None"
harness = "checks/find_char_check.dc"
expect_exit = 0
max_seconds = 10
hint = "Return Optional::Some(i) at the first match and Optional::None only after the loop."

[[checks]]
kind = "harness"
name = "first_word stops before the first space"
harness = "checks/first_word_check.dc"
expect_exit = 0
max_seconds = 10
hint = "text[0..i] excludes position i, so it ends just before the space."
