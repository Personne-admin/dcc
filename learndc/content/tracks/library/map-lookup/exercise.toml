schema = 1
id = "library/map-lookup"
revision = 1
title = "Track stock with a map"
summary = "Use std::map::Map to insert, update, look up and remove counts by key."
kind = "libdcext"
chapter = "collections"
difficulty = "intermediate"
estimated_minutes = 20
concepts = ["Map", "get", "get_ptr", "put", "Optional", "deinit"]
tags = ["collections", "map"]
objectives = [
    "Create a Map(u32, u32), store it in a using alias and release it with defer deinit",
    "Look a key up with get and supply a default with some_or",
    "Update a stored value in place through get_ptr, and insert with put when the key is absent",
]
entry_file = "src/main.dc"
product = "stockroom"
prerequisites = ["library/text-slices"]
requires = ["dcc", "dpm"]
min_dcc = "0.6.0"
platforms = ["linux", "windows"]
backends = ["llvm", "custom"]
starter_state = "fails-checks"

[[checks]]
kind = "build"
name = "Compiles"

[[checks]]
kind = "run"
name = "Stock levels after adding and taking"
expect_stdout = """
part 101: 15
part 202: 4
part 303: 0
take 12 of 101: true
take 9 of 202: false
part 101: 3
part 202: 4
parts tracked: 2
"""
expect_exit = 0
max_seconds = 10
hint = "Adding to a part that is already stored must increase its count, not replace it, and a failed take must leave the count unchanged."
