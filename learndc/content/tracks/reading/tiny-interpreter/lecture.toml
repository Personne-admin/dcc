revision = 1
title = "Reading an interpreter loop"
summary = "Follow a stack machine that runs a list of instructions with a match inside a while loop, jumps included."
difficulty = "intermediate"
estimated_minutes = 25
concepts = [
    "tagged enums",
    "match",
    "while loops",
    "stack",
    "code reading",
]
