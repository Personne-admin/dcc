schema = 1
id = "adv-memory/allocator-contract"
revision = 1
title = "The allocator contract"
summary = "The three-method allocator contract, the Heap, typed helpers, fixed buffers, containers over any allocator and arenas."
difficulty = "advanced"
estimated_minutes = 20
concepts = ["allocator", "Heap", "AllocError", "create_item", "allocate_slice", "FixedBuffer", "Arena", "ownership"]
tags = ["lecture", "memory", "allocators"]
objectives = [
    "Name the three methods of the allocator contract and what each promises",
    "Allocate, use and free a block and typed values with the Heap",
    "Use a FixedBuffer and an Arena, and explain what free means for each",
    "Say who owns a block and which allocator must free it",
]
prerequisites = ["adv-memory/view-toolkit"]

[[examples]]
name = "heap_blocks"
expect_stdout = """
got 100 bytes, aligned to 16: true
last byte: 99
alignment 3 refused: true
"""

[[examples]]
