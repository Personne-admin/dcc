schema = 1
id = "adv-generics/compile-time-programs"
revision = 1
title = "Compile-time programs"
summary = "Build tables with CTFE, drive code from constants and value template parameters, and report bad requests with core::compile_error."
difficulty = "advanced"
estimated_minutes = 22
concepts = ["CTFE", "value alias", "lookup table", "value template parameter", "static if", "compile_error"]
tags = ["lecture", "generics", "compile time"]
objectives = [
    "Build a lookup table with an ordinary function run by the compiler and read it at run time",
    "State what a compile-time function may not do and read the diagnostic when it does it",
    "Use value template parameters and core::compile_error to design an API with clear errors",
]
prerequisites = ["adv-generics/pack-tools"]

