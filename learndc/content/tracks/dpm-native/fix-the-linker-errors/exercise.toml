schema = 1
id = "dpm-native/fix-the-linker-errors"
revision = 1
title = "Three mistakes in one program"
summary = "Fix a wrong library name, a misspelled symbol and a lying signature, each of which shows up differently."
kind = "multi-module"
difficulty = "intermediate"
estimated_minutes = 20
concepts = [
    "linker errors",
    "extern",
    "signatures",
    "link",
]
tags = [
    "dpm",
]
objectives = [
    "Read a missing-library message",
    "Use the did-you-mean suggestion of an undefined symbol",
    "Notice a wrong result that no tool reports",
]
entry_file = "src/main.dc"
product = "geometry"
prerequisites = [
    "dpm-native/library-owns-the-link",
]
requires = [
    "dcc",
    "dpm",
]
min_dcc = "0.6.0"
platforms = [
    "linux",
]
backends = [
    "llvm",
    "custom",
]
starter_state = "fails-build"

[[checks]]
kind = "build"
name = "Compiles"

[[checks]]
kind = "run"
name = "Three results from libm"
expect_stdout = '''
cos(0) = 1.0000
sqrt(2) = 1.4142
pow(2, 10) = 1024.0000
'''
expect_exit = 0
max_seconds = 10
