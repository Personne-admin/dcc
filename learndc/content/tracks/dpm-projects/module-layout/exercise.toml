schema = 1
id = "dpm-projects/module-layout"
revision = 1
title = "Put the modules under the package name"
summary = "Move the harbor code into harbor::ships and harbor::report so that other projects could import it."
kind = "multi-module"
difficulty = "intermediate"
estimated_minutes = 15
concepts = [
    "modules",
    "source root",
    "namespace",
    "import",
    "file layout",
]
tags = [
    "dpm",
]
objectives = [
    "Map a module path to a file under src",
    "Name modules after the package so they cannot collide with other packages",
    "Update imports when code moves",
]
entry_file = "src/main.dc"
product = "harbor"
prerequisites = [
    "dpm-projects/second-product",
]
requires = [
    "dcc",
    "dpm",
]
min_dcc = "0.6.0"
platforms = [
    "linux",
]
backends = [
    "llvm",
    "custom",
]
starter_state = "fails-build"

[[checks]]
kind = "build"
name = "Compiles"

[[checks]]
kind = "run"
name = "The table is printed"
expect_stdout = '''
Aurora 120 t
Brisa 80 t
Corvo 200 t
Delta 45 t
total 445 t
'''
expect_exit = 0
max_seconds = 10
