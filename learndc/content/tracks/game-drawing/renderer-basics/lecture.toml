schema = 1
id = "game-drawing/renderer-basics"
revision = 1
title = "The renderer, coordinates and drawing from data"
summary = "How a renderer draws: current color, clear and present, the top left origin, painter's order, shapes from arrays and logical presentation."
difficulty = "intermediate"
estimated_minutes = 15
concepts = ["renderer", "draw color", "SDL_FRect", "painter's order", "logical presentation"]
tags = ["lecture", "games", "sdl3", "drawing"]
objectives = [
    "Describe a frame as clear, draw, present",
    "Place shapes with the origin at the top left and y growing downwards",
    "Explain why the order of draw calls is the layering",
    "Draw many shapes from one array in one loop",
    "Compute the scale and offset of a letterboxed logical size",
]
prerequisites = ["game-setup/setup-drills"]

