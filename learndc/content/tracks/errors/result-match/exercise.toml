schema = 1
id = "errors/result-match"
revision = 1
title = "Success or a reason: Result"
summary = "Return Ok or Err with your own error enum, then match on both outcomes."
kind = "implement-function"
difficulty = "beginner"
estimated_minutes = 15
concepts = ["Result", "Result::Ok", "Result::Err", "error enum", "nested match"]
tags = ["result", "enum", "match"]
objectives = [
    "Return Result::Ok(value) or Result::Err(error) from a function",
    "Describe failures with a small user-defined enum",
    "Match on both outcomes and then on the kind of error",
]
entry_file = "src/main.dc"
product = "agecheck"
prerequisites = ["errors/optional"]
requires = ["dcc", "dpm"]
min_dcc = "0.6.0"
platforms = ["linux", "windows"]
backends = ["llvm", "custom"]
starter_state = "fails-checks"

[[checks]]
kind = "build"
name = "Compiles"

[[checks]]
kind = "harness"
name = "check_age accepts 0..=150 and rejects the rest"
harness = "checks/ages_check.dc"
expect_exit = 0
max_seconds = 10

[[checks]]
kind = "run"
name = "Reports each age"
expect_stdout = """
30 is a valid age
-4: ages cannot be negative
200: too old to be real
150 is a valid age
"""
expect_exit = 0
max_seconds = 10
hint = "Match the exact wording, including the age in the error lines and the colon after it."
