schema = 1
id = "data/struct-pointers"
revision = 1
title = "Structs and functions on them"
summary = "Declare data in a struct and give it behavior with plain functions."
kind = "implement-function"
difficulty = "beginner"
estimated_minutes = 10
concepts = ["struct", "struct literal", "pointer parameter", "UFCS"]
tags = ["structs", "functions", "pointers"]
objectives = [
    "Build a struct value with a struct literal",
    "Read fields of a by-value parameter and modify fields through a pointer parameter",
    "Call functions with dot syntax (UFCS)",
]
entry_file = "src/main.dc"
product = "rooms"
prerequisites = ["collections/arrays-and-slices"]
requires = ["dcc", "dpm"]
min_dcc = "0.6.0"
platforms = ["linux", "windows"]
backends = ["llvm", "custom"]
starter_state = "fails-checks"

[[checks]]
kind = "build"
name = "Compiles"

[[checks]]
kind = "run"
name = "Prints the three rooms"
expect_stdout = """
hall: 4x3, area 12
grown: 6x5, area 30
cell: 5x5, area 25
"""
expect_exit = 0
max_seconds = 10
hint = "grow must change the caller's rectangle, so it needs to write through the Rect* pointer."

[[checks]]
kind = "harness"
name = "area, grow and square behave as specified"
harness = "checks/geometry_check.dc"
expect_exit = 0
max_seconds = 10
hint = "grow adds the same amount to both width and height; square uses the side for both."
