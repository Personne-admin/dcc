schema = 1
id = "data/tagged-enums"
revision = 1
title = "Tagged enums and match"
summary = "Cover every variant of an enum that carries data."
kind = "repair-compilation"
difficulty = "beginner"
estimated_minutes = 10
concepts = ["tagged enum", "variant payload", "match", "exhaustiveness"]
tags = ["enums", "match"]
objectives = [
    "Read an enum whose variants carry different data",
    "Understand the compiler's non-exhaustive match diagnostic",
    "Bind a variant's payload in a match arm and use it",
]
entry_file = "src/main.dc"
product = "shapes"
prerequisites = ["data/match"]
requires = ["dcc", "dpm"]
min_dcc = "0.6.0"
platforms = ["linux", "windows"]
backends = ["llvm", "custom"]
starter_state = "fails-build"

[[checks]]
kind = "build"
name = "Compiles"

[[checks]]
kind = "run"
name = "Prints area and corners for each shape"
expect_stdout = """
disc: area 12, corners 0
wall: area 15, corners 4
nothing: area 0, corners 0
"""
expect_exit = 0
max_seconds = 10
hint = "A rectangle's area is size.width * size.height."

[[checks]]
kind = "harness"
name = "area is right for every variant"
harness = "checks/shapes_check.dc"
expect_exit = 0
max_seconds = 10
hint = "Circle(r) is 3 * r * r, Rect(size) is width times height, Empty is 0."
