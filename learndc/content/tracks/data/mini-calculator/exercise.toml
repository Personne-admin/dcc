schema = 1
id = "data/mini-calculator"
revision = 1
title = "Mini calculator"
summary = "Combine an enum, match, functions and a loop to evaluate a list of steps."
kind = "challenge"
difficulty = "beginner"
estimated_minutes = 15
concepts = ["enum", "match", "struct", "slices", "for", "functions"]
tags = ["challenge", "enums", "loops"]
objectives = [
    "Model operations with an enum and data with a struct",
    "Implement a match that computes a value and a match that returns text",
    "Fold a list of steps into one result with a for loop",
]
entry_file = "src/main.dc"
product = "calculator"
prerequisites = ["functions/reading-errors"]
requires = ["dcc", "dpm"]
min_dcc = "0.6.0"
platforms = ["linux", "windows"]
backends = ["llvm"]
starter_state = "fails-checks"

[[checks]]
kind = "build"
name = "Compiles"

[[checks]]
kind = "run"
name = "Program prints a trace and both results"
expect_stdout = """
+ 5 -> 5
* 3 -> 15
- 4 -> 11
/ 0 -> 11
/ 2 -> 5
+ 20 -> 25
result: 25
second result: 3
"""
expect_exit = 0
max_seconds = 10
hint = "Division by zero leaves the running value unchanged, and division truncates: 11 / 2 is 5."

[[checks]]
kind = "harness"
name = "symbol and apply"
harness = "checks/op_checks.dc"
expect_exit = 0
max_seconds = 10
hint = "Each Op variant needs its own arm in both symbol and apply, including Div with a zero operand."

[[checks]]
kind = "harness"
name = "evaluate"
harness = "checks/eval_checks.dc"
expect_exit = 0
max_seconds = 10
hint = "Start the running value at 0 and apply the steps in order. An empty list gives 0."
