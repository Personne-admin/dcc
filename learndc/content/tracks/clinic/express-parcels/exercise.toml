schema = 1
id = "clinic/express-parcels"
revision = 1
title = "Express at the local rate"
summary = "A new delivery zone was added to an enum but a wildcard match arm quietly priced it as a local parcel."
kind = "fix-behavior"
difficulty = "intermediate"
estimated_minutes = 15
concepts = [
    "match",
    "wildcard arm",
    "enum",
    "exhaustiveness",
]
tags = [
    "clinic",
    "match",
    "enums",
]
objectives = [
    "Explain how a `_` arm hides a missing case",
    "Price every zone with an explicit arm",
    "Prove the fix with the expected output",
]
entry_file = "src/main.dc"
product = "express_parcels"
prerequisites = ["data/match"]
requires = ["dcc", "dpm"]
min_dcc = "0.6.0"
platforms = ["linux", "windows"]
backends = ["llvm", "custom"]
starter_state = "fails-checks"
optional = true

[[stages]]
id = "locate"
title = "Locate the cause"
summary = "Reproduce the symptom, narrow it down and name the faulty line before you change anything."
hints = [
    "`Zone::Express` is new. Where in the code is a decision made for every zone?",
    "Read the arms of `fee` from the top and ask for each zone which arm it ends in. Which arm does `Zone::Express` reach?",
]
questions = ["find-the-wildcard"]

[[stages]]
id = "fix"
title = "Fix and prove it"
summary = "Make the program print the expected output."
hints = [
    "A `_` arm answers for every variant that exists now and every variant added in the future.",
    "Replace `_` with an arm for `Zone::Local` and add an arm for `Zone::Express` priced 15 plus 3 per kilo.",
    "Delete `_ => 4 + kilos,` and add `Zone::Local => 4 + kilos,` and `Zone::Express => 15 + 3 * kilos,`.",
]

[[checks]]
kind = "build"
name = "Compiles"

[[checks]]
kind = "run"
name = "Prints the expected output"
stage = "fix"
expect_stdout = """
same town: 7 for 3 kg
next county: 14 for 3 kg
abroad: 35 for 3 kg
next day: 24 for 3 kg
"""
expect_exit = 0
max_seconds = 10
hint = "Each zone needs its own price; express is 15 plus 3 per kilo."

[[questions]]
id = "find-the-wildcard"
type = "bug"
prompt = "Express parcels get the local price. Which line decides that?"
code = """
module main;

enum Zone { Local, National, Overseas, Express }

i32 fee(Zone zone, i32 kilos) {
    return match zone {
        Zone::National => 8 + 2 * kilos,
        Zone::Overseas => 20 + 5 * kilos,
        _ => 4 + kilos,
    };
}

Status(Error) quote([]const char label, Zone zone, i32 kilos) {
    println("{}: {} for {} kg", label, fee(zone, kilos), kilos)?;
    return Status::Ok;
}

public Status(Error) main() {
    quote("same town", Zone::Local, 3)?;
    quote("next county", Zone::National, 3)?;
    quote("abroad", Zone::Overseas, 3)?;
    quote("next day", Zone::Express, 3)?;
    return Status::Ok;
}
"""
lines = [9]
fixed = """
module main;

enum Zone { Local, National, Overseas, Express }

i32 fee(Zone zone, i32 kilos) {
    return match zone {
        Zone::National => 8 + 2 * kilos,
        Zone::Overseas => 20 + 5 * kilos,
        Zone::Local => 4 + kilos,
        Zone::Express => 15 + 3 * kilos,
    };
}

Status(Error) quote([]const char label, Zone zone, i32 kilos) {
    println("{}: {} for {} kg", label, fee(zone, kilos), kilos)?;
    return Status::Ok;
}

public Status(Error) main() {
    quote("same town", Zone::Local, 3)?;
    quote("next county", Zone::National, 3)?;
    quote("abroad", Zone::Overseas, 3)?;
    quote("next day", Zone::Express, 3)?;
    return Status::Ok;
}
"""
expect = """
same town: 7 for 3 kg
next county: 14 for 3 kg
abroad: 35 for 3 kg
next day: 24 for 3 kg
"""
explanation = "The `_` arm matches every zone the earlier arms did not name. When `Zone::Express` was added, nothing forced anybody to touch `fee`: the wildcard took it silently and priced it like `Local`. Naming `Zone::Local` and `Zone::Express` explicitly removes the wildcard, so the compiler reports a non-exhaustive match whenever a zone is added later."
