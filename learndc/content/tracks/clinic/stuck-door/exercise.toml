"""
explanation = "A state machine is a table of (state, event) pairs. The pair (Open, Lock) must stay Open, but the arm in the Open block says `Event::Lock => State::Locked`. The same text in the Closed block is correct, which makes copy and paste the likely origin. Fix it by deleting the arm so the `_ => State::Open` arm keeps the door open."
