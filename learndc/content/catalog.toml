[[paths]]
id = "core"
title = "Core curriculum"
summary = "The beginner journey: programs, values, functions, decisions, loops, data, errors, memory, modules and generics, one concept at a time."
kind = "core"
tracks = ["first-steps", "values", "functions", "decisions", "loops", "collections", "data", "errors", "memory", "projects", "library", "generics"]

[[paths]]
id = "advanced"
title = "Advanced DC"
summary = "Memory layout, allocators, C interop and native linking, generics and compile-time programming, data structures and robust design."
kind = "specialization"
tracks = ["adv-memory", "adv-interop", "adv-generics", "adv-structures", "adv-design"]

[[paths]]
id = "libdcext"
title = "The standard library"
summary = "Real-world libdcext: JSON and TOML, files and paths, collections, text and hashing, processes, threads and networking."
kind = "specialization"
tracks = ["lib-data", "lib-files", "lib-collections", "lib-concurrency"]

[[paths]]
id = "dpm"
title = "DPM mastery"
summary = "Projects and products, dependencies and locks, profiles, tasks and assets, native libraries, and packaging a reusable library."
kind = "specialization"
tracks = ["dpm-projects", "dpm-dependencies", "dpm-builds", "dpm-native", "dpm-packaging"]

[[paths]]
id = "games"
title = "Game development (SDL3)"
summary = "An SDL3 tutorial in DC: windows, drawing, game loops and input, motion and collision, sprites, scenes and three complete games. Needs SDL3 (learndc setup sdl3)."
kind = "specialization"
tracks = ["game-setup", "game-drawing", "game-loop", "game-motion", "game-sprites", "game-scenes"]

[[paths]]
id = "practice"
title = "Projects and challenges"
summary = "Optional practice in any order: projects to build, realistic bugs to diagnose, unfamiliar programs to read, sharp challenges and mastery tests."
kind = "practice"
tracks = ["lab", "clinic", "reading", "challenges", "mastery"]

